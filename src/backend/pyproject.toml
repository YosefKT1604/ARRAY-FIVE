[project]
name = "orbyte-backend"
version = "0.1.0"
description = "Backend API for the AI-based disruption-recovery system."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.153.0",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.5",
]

[project.optional-dependencies]
# Live AI model for scdc.ai (optional: the app, its fallbacks and all tests work without it).
# Pinned EXACTLY: litellm 1.82.7 and 1.82.8 were compromised on PyPI (March 2026).
# Only upgrade deliberately, to a release that has been public for at least two weeks.
llm = ["litellm==1.100.5"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
